name: QuietCast
options:
  bundleIdPrefix: art.quietcast
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.47.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  QuietCast:
    type: application
    platform: iOS
    sources:
      - path: QuietCast/Sources
      - path: QuietCast/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.quietcast.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: ""
    info:
      path: QuietCast/Info.plist
      properties:
        CFBundleDisplayName: Quiet Cast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIAppFonts:
          - CormorantGaramond-Regular.ttf
          - CormorantGaramond-Italic.ttf
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-MediumItalic.ttf
          - CormorantGaramond-SemiBold.ttf
          - CormorantGaramond-Bold.ttf
          - CormorantGaramond-Light.ttf
          - CormorantGaramond-LightItalic.ttf
          - Spectral-Light.ttf
          - Spectral-LightItalic.ttf
          - Spectral-Regular.ttf
          - Spectral-Italic.ttf
          - Spectral-Medium.ttf
          - Spectral-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Italic.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf

  QuietCastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuietCastTests
    dependencies:
      - target: QuietCast

schemes:
  QuietCast:
    build:
      targets:
        QuietCast: all
    test:
      targets:
        - QuietCastTests
